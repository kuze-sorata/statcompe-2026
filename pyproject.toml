[project]
name = "statcompe-2026"
version = "0.1.0"
description = "統計データ分析コンペティション2026の分析プロジェクト"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "beautifulsoup4>=4.13",
    "cryptography>=50.0.0",
    "geopandas>=1.1",
    "ipykernel>=6.30",
    "jupyterlab>=4.4",
    "lxml>=6.0",
    "matplotlib>=3.10",
    "numpy>=2.3",
    "openpyxl>=3.1",
    "pandas>=2.3",
    "plotly>=6.3",
    "pyarrow>=21.0",
    "pypdf>=6.0",
    "python-docx>=1.2",
    "requests>=2.32",
    "scikit-learn>=1.7",
    "scipy>=1.16",
    "seaborn>=0.13",
    "statsmodels>=0.14",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.12",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/statcompe_2026"]
